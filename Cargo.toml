[package]
name = "portfolio-backend"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "portfolio-backend"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gray_matter = "0.2"
pulldown-cmark = "0.11"
walkdir = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
once_cell = "1"
